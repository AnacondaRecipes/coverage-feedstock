{% set name = "coverage" %}
{% set version = "7.17.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d05a1bef52f4d7f1b484a1cf46a8929e50963f910e51396373f06cd3b6248f38
  patches:
    - 0001-force-extension-module-creation.patch

build:
  number: 0
  entry_points:
    - coverage = coverage.cmdline:main
  skip: true  # [py<311]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

# Both tests use tests/helpers.py:all_our_source_files(), which asserts that the
# repo's "ci" and "lab" directories exist. Only "tests" is copied into the conda
# test work directory, so those tests cannot run here.
{% set deselect_tests = " --deselect=tests/test_regions.py::test_real_code_regions" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/test_testing.py::test_all_our_source_files" %}
test:
  source_files:
    - tests
  imports:
    - coverage
    - coverage.annotate
    - coverage.bytecode
    - coverage.cmdline
    - coverage.collector
    - coverage.config
    - coverage.context
    - coverage.control
    - coverage.core
    - coverage.data
    - coverage.debug
    - coverage.disposition
    - coverage.env
    - coverage.exceptions
    - coverage.execfile
    - coverage.files
    - coverage.html
    - coverage.inorout
    - coverage.jsonreport
    - coverage.lcovreport
    - coverage.misc
    - coverage.multiproc
    - coverage.numbits
    - coverage.pth_file
    - coverage.parser
    - coverage.patch
    - coverage.phystokens
    - coverage.plugin
    - coverage.plugin_support
    - coverage.python
    - coverage.pytracer
    - coverage.regions
    - coverage.report
    - coverage.report_core
    - coverage.results
    - coverage.sqldata
    - coverage.sqlitedb
    - coverage.sysmon
    - coverage.templite
    - coverage.tomlconfig
    - coverage.tracer
    - coverage.types
    - coverage.version
    - coverage.xmlreport
  commands:
    - pip check
    - coverage --help
    - pytest -vv tests {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - hypothesis

about:
  home: https://coverage.readthedocs.io
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE.txt
    - NOTICE.txt
  summary: Code coverage measurement for Python
  description: |
    Coverage.py is a tool for measuring code coverage of Python programs. It
    monitors your program, noting which parts of the code have been executed,
    then analyzes the source to identify code that could have been executed
    but was not. Coverage measurement is typically used to gauge the
    effectiveness of tests. It can show which parts of your code are being
    exercised by tests, and which are not.
  doc_url: https://coverage.readthedocs.io
  dev_url: https://github.com/coveragepy/coveragepy

extra:
  recipe-maintainers:
    - ericmjl
    - jakirkham
    - ocefpaf
